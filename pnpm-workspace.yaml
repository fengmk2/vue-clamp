packages:
  - packages/*
  - tools/*
allowBuilds:
  better-sqlite3: true
  esbuild: true
  sharp: true
  workerd: true

catalog:
  "@lucide/vue": ^1.12.0
  "@types/node": ^25.6.0
  "@types/stats.js": ^0.17.4
  "@vitejs/plugin-vue": ^6.0.6
  "@vitest/browser-playwright": 4.1.9
  "@vue-macros/define-render": ^3.1.2
  "@vue/compiler-dom": ^3.5.33
  "@vue/compiler-sfc": ^3.5.33
  bumpp: ^11.0.1
  overlayscrollbars: ^2.15.1
  playwright: ^1.59.1
  releaselog: ^7.0.2
  shiki: ^4.0.2
  simple-icons: ^16.18.0
  stats.js: ^0.17.0
  typescript: ^6.0.3
  unplugin-vue: ^7.2.0
  vite: ^8.0.11
  vite-plus: https://pkg.pr.new/voidzero-dev/vite-plus@1856
  void: 0.9.2
  vue: ^3.5.33
  vue-tsc: ^3.2.7

catalogMode: prefer
overrides:
  vite: https://pkg.pr.new/voidzero-dev/vite-plus/@voidzero-dev/vite-plus-core@1856
  vitest: 4.1.9
minimumReleaseAge: 60
minimumReleaseAgeExclude:
  - "@voidzero-dev/*"
  - vite-plus
  - "@vitest/*"
  - vite
  - vitest
  - "@oxc-project/*"
  - "@oxlint/*"
  - oxlint
  - oxfmt
  - oxlint-tsgolint
blockExoticSubdeps: false
